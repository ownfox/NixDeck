# ╔══════════════════════════════════════════════════════════════════╗
# ║  Hyprland конфиг — Steam Deck OLED                              ║
# ║  Оптимизации: OLED-чёрный фон, VFR, энергосбережение,          ║
# ║  Hyprgrass жесты, Steam Input интеграция                        ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── Монитор (Steam Deck OLED: 1280x800 @ 90Hz) ──────────────────
monitor = , preferred, auto, 1

# ── Ввод (сенсорный экран + геймпад) ─────────────────────────────
input {
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# ── Общие настройки ──────────────────────────────────────────────
general {
    gaps_in = 3
    gaps_out = 5
    border_size = 2
    col.active_border = rgb(1e66f5)    # строгий синий
    col.inactive_border = rgb(000000)  # чисто чёрный для OLED
    layout = dwindle
}

# ── Декорации (OLED-оптимизация: минимум blur) ───────────────────
decoration {
    rounding = 8

    blur {
        enabled = false   # ВЫКЛЮЧЕНО: экономия батареи на OLED
    }

    shadow {
        enabled = false   # ВЫКЛЮЧЕНО: экономия GPU
    }
}

# ── Анимации (минималистичные для батареи) ────────────────────────
animations {
    enabled = true
    bezier = snappy, 0.25, 1.0, 0.5, 1.0
    animation = windows, 1, 3, snappy
    animation = windowsOut, 1, 3, snappy, popin 80%
    animation = fade, 1, 3, snappy
    animation = workspaces, 1, 3, snappy, slidevert
}

# ── Layout ───────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

# ── Misc (VFR — энергосбережение!) ───────────────────────────────
misc {
    vfr = true                        # Variable Frame Rate — не рендерить лишнее
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0       # чёрные пиксели = выключенные пиксели OLED
}

# ── Hyprgrass — жесты сенсорного экрана ──────────────────────────
plugin = /path/to/hyprgrass.so        # ← путь обновится при сборке

# Свайпы для переключения рабочих столов
plugin:touch_gestures {
    workspace_swipe_fingers = 3       # 3 пальца — смена workspace
    workspace_swipe_edge = l          # свайп от левого края
}

# ── Горячие клавиши (Steam Input через радиальное меню) ───────────
$mod = SUPER

# Базовые действия
bind = $mod, Return, exec, foot       # терминал
bind = $mod, Q, killactive
bind = $mod, D, exec, rofi -show drun  # лаунчер
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, K, exec, wvkbd-mobintl   # виртуальная клавиатура

# Навигация между окнами
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Рабочие столы
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4

# Перемещение окон между рабочими столами
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Управление мышью / тачпадом
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Автозапуск ───────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /run/current-system/sw/libexec/polkit-kde-authentication-agent-1
exec-once = kdeconnect-indicator
